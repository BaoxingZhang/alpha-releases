name: maintenance

on:
  push:
    branches: [main, master, recovery/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    # The checked-in Go bootstrap is deliberately pinned to macOS arm64.
    # Keep this job on the matching hosted runner instead of silently falling
    # back to a system Go or producing an x86 artifact.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source and reference submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron and esbuild binaries
        run: npm run setup

      - name: Build independent backend, packaged resources, and desktop bundle
        run: npm run build:packaged

      - name: Assemble unsigned macOS app and verify its manifest
        run: npm run package:macos-app:from-build

      - name: Assemble unsigned independent macOS app and verify its marker
        run: npm run package:macos-app:independent:from-build

      - name: Verify packaged backend markers and identities
        run: npm run verify:packaged-markers

      - name: Run packaged independent Electron smoke
        run: |
          set -o pipefail
          npm run test:packaged-independent 2>&1 | tee .runtime/packaged-independent-smoke.log

      - name: Run complete test suite
        run: npm test

      - name: Run independent desktop smoke
        run: npm run test:independent

      - name: Run original runtime and isolation smoke
        run: npm run test:smoke

      - name: Audit locked dependencies
        run: npm run verify:dependencies

      - name: Audit independent API coverage
        run: npm run audit:api

      - name: Report public release privacy findings
        run: npm run audit:public-release -- --report .runtime/public-release-audit.json

      - name: Generate unsigned artifact manifest and recovery source bundle
        run: |
          npm run release:manifest
          npm run verify:release-manifest
          npm run bundle:recovery

      - name: Verify maintenance boundaries
        run: |
          npm run verify:maintenance
          git diff --check

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-maintenance-reports-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            docs/*-run.json
            docs/*-validation*.json
            docs/independent-support-matrix.json
            docs/build-results.json
            build/candidates/*-build.json
            packages/alpha-data-bridge/build-validation.json
            packages/alpha-snapshot-import/build-validation.json
            .runtime/release-manifest.json
            .runtime/public-release-audit.json
            .runtime/packaged-independent-smoke.log
            .runtime/release-artifacts/Alpha Recovered.app.manifest.json
            .runtime/release-artifacts/Alpha Recovered Independent.app.manifest.json
            .runtime/recovery-bundles/alpha-recovered-source.tar.gz
            .runtime/recovery-bundles/alpha-recovered-source.tar.gz.manifest.json
